const DEFSUB=['N[ts]','P[2]O[5hh]','P[2]O[5]','K[2]O[hh]','K[2]O','SiO[2hh]','SiO[2]','pH[H]{2}[O]'];
const DEFJUS={on:true,w:[90,100,110],l:[-1,0,1],g:[98,100,102],last:true,al:true,alp:120};
const jusCfg=()=>Object.assign({},DEFJUS,S.jus||{});
const subCfg=()=>({shift:S.shift!=null?S.shift:1,rules:Array.isArray(S.sub)&&S.sub.length?S.sub:DEFSUB,jus:jusCfg()});
/* findSub: viết kiểu ES3 vì được nhúng nguyên văn vào script .jsx của Illustrator */
function findSub(text,rules){
var low=text.toLowerCase(),res=[],r,i,ch,s,segs,cur,lv,lit,any,from,at,p,k,e;
if(low.length!==text.length)low=text;
function isL(c){return c!==''&&/[A-Za-z\u00C0-\u024F\u1E00-\u1EFF]/.test(c)}
for(r=0;r<rules.length;r++){
s=rules[r];segs=[];cur='';lv=0;lit='';any=false;
for(i=0;i<s.length;i++){
ch=s.charAt(i);
if(ch==='['||ch==='{'){if(cur)segs.push([cur,lv]);cur='';lv=ch==='['?1:2}
else if(ch===']'||ch==='}'){if(cur){segs.push([cur,lv]);any=true}cur='';lv=0}
else cur+=ch}
if(cur)segs.push([cur,lv]);
for(k=0;k<segs.length;k++)lit+=segs[k][0];
lit=lit.toLowerCase();
if(!any||!lit)continue;
from=0;
while((at=low.indexOf(lit,from))>=0){
if(isL(text.charAt(at-1))||isL(text.charAt(at+lit.length))){from=at+1;continue}
p=at;
for(k=0;k<segs.length;k++){e=p+segs[k][0].length;if(segs[k][1])res.push([p,e,segs[k][1]]);p=e}
from=at+lit.length}}
return res}
function subHTML(text){const c=subCfg(),rg=findSub(text,c.rules),f=new Array(text.length).fill(0);
rg.forEach(x=>{for(let i=x[0];i<x[1];i++)f[i]=Math.max(f[i],x[2])});
let h='',cl=0;
for(let i=0;i<text.length;i++){if(f[i]!==cl){if(cl)h+='</span>';if(f[i])h+='<span class="'+(f[i]>1?'sd2':'sd')+'">';cl=f[i]}h+=esc(text.charAt(i))}
if(cl)h+='</span>';
return{h,n:rg.length,shift:c.shift}}
const asc=s=>s.replace(/[^\x00-\x7e]/g,c=>'\\u'+c.charCodeAt(0).toString(16).padStart(4,'0'));
function jsxText(c){const J=c.jus,jo=!!(J&&J.on);return asc(`#target illustrator
// Heiniken - ha thap chu (Baseline Shift)${jo?' + can deu hai ben (Justify)':''}. Chay: File > Scripts > Other Script...
// SHIFT = so pt ha xuong cho 1 muc; muc 2 = gap doi.
(function(){
var SHIFT=${c.shift};
var RULES=${JSON.stringify(c.rules)};
var JUS=${jo?JSON.stringify({w:J.w,l:J.l,g:J.g,last:J.last,al:J.al,alp:J.alp}):'null'};
${findSub.toString()}
if(app.documents.length===0){alert("Hãy mở file Illustrator trước.");return}
var doc=app.activeDocument,ranges=[],frs=[],sel=doc.selection,i,k,m;
function add(it){var j;
if(it.typename==="TextFrame"){ranges.push(it.textRange);frs.push(it)}
else if(it.typename==="GroupItem")for(j=0;j<it.pageItems.length;j++)add(it.pageItems[j])}
if(sel&&sel.typename==="TextRange"){ranges.push(sel.story.textRange);frs.push(null)}
else if(sel&&sel.length){for(i=0;i<sel.length;i++)add(sel[i])}
else{
if(!confirm("Chưa chọn đối tượng nào. Áp dụng cho TẤT CẢ chữ trong file?"))return;
for(i=0;i<doc.textFrames.length;i++){ranges.push(doc.textFrames[i].textRange);frs.push(doc.textFrames[i])}}
var chars=0,frames=0,fail=0,jus=0,ovf=0;
for(i=0;i<ranges.length;i++){
try{
var tr=ranges[i],rg=findSub(tr.contents,RULES),ch,n=0,pa,ca;
if(JUS){pa=tr.paragraphAttributes;ca=tr.characterAttributes;
pa.justification=JUS.last?Justification.FULLJUSTIFY:Justification.FULLJUSTIFYLASTLINELEFT;
pa.minimumWordSpacing=JUS.w[0];pa.desiredWordSpacing=JUS.w[1];pa.maximumWordSpacing=JUS.w[2];
pa.minimumLetterSpacing=JUS.l[0];pa.desiredLetterSpacing=JUS.l[1];pa.maximumLetterSpacing=JUS.l[2];
pa.minimumGlyphScaling=JUS.g[0];pa.desiredGlyphScaling=JUS.g[1];pa.maximumGlyphScaling=JUS.g[2];
ca.autoLeading=JUS.al;if(JUS.al)ca.autoLeadingAmount=JUS.alp;
jus++;
try{if(frs[i]&&frs[i].overflows)ovf++}catch(e2){}}
ch=tr.characters;
for(k=0;k<rg.length;k++)for(m=rg[k][0];m<rg[k][1];m++){ch[m].characterAttributes.baselineShift=-SHIFT*rg[k][2];n++}
if(n){chars+=n;frames++}
}catch(e){fail++}}
var msg="Đã hạ thấp "+chars+" ký tự trong "+frames+" khung chữ.";
if(JUS){msg+="\\nĐã căn đều (Justify) "+jus+" khung chữ.\\nWord Spacing: "+JUS.w.join(" / ")+"%\\nLetter Spacing: "+JUS.l.join(" / ")+"%\\nGlyph Scaling: "+JUS.g.join(" / ")+"%"+(JUS.al?"\\nAuto Leading: "+JUS.alp+"%":"");
if(ovf)msg+="\\nKhung có thể tràn chữ: "+ovf}
if(fail)msg+="\\nBỏ qua "+fail+" khung (có thể đang bị khóa).";
alert(msg)
})();
`)}

function backup(){openD('Excel & sao lưu',`<p class="e">Tool và file Excel dùng chung cấu trúc sheet <b>Short SP</b> (cột A:AA – cột AA là quốc gia SX đã xác nhận) và <b>Sản xuất</b>. Xuất ra để đưa vào Heiniken.xlsx, hoặc nhập trực tiếp từ Heiniken.xlsx / file đã xuất.</p>
<label>Cách nhập<select id="im"><option value="m">Gộp theo MSPB (cập nhật SP trùng, thêm SP mới, giữ SP không có trong file)</option><option value="r">Thay thế toàn bộ bằng dữ liệu trong file</option></select></label>
<div class="act" style="justify-content:flex-start;margin:0 0 8px"><button id="bx" class="pri">📤 Xuất ra Excel (.xlsx)</button><button id="bi">📥 Nhập từ Excel</button><button id="bt">📋 Sao chép bảng (dán vào sheet Short SP)</button></div>
<input type="file" id="fi" accept=".xlsx,.xlsm,.xls" hidden>
<div class="bar">Hoặc dán bảng đã copy từ Excel</div>
<textarea id="tp" rows="4" placeholder="Copy vùng A5:AA… (hoặc từ dòng tiêu đề A4) của sheet Short SP rồi dán vào đây"></textarea>
<div class="act"><button id="tl">Nạp dữ liệu đã dán</button></div>`,null,'<button id="rs">Khôi phục dữ liệu gốc</button>');
$('#bx').onclick=exportX;$('#bi').onclick=()=>$('#fi').click();
$('#fi').onchange=e=>{const f=e.target.files[0];if(f)importX(f);e.target.value=''};
$('#bt').onclick=e=>{copy(toRows().slice(4).map(r=>r.map(x=>x==null?'':typeof x==='boolean'?(x?'TRUE':'FALSE'):x).join('\t')).join('\n'),e.target);note('Dán vào ô A5 của sheet Short SP.'+over())};
$('#tl').onclick=()=>{try{applyData(fromRows($('#tp').value.split(/\r?\n/).map(l=>l.split('\t'))))}catch(e){note('Không đọc được: '+(e.message||e))}};
$('#rs').onclick=e=>{if(sure(e.target,'Bấm lần nữa để xóa mọi chỉnh sửa')){S={...clone({P:D.P,C:D.C,foot:D.foot}),sel:'08737',ctry:'Mỹ'};save();renderCt();render();note('Đã khôi phục dữ liệu Excel gốc.')}}}
$('#ct').onchange=e=>{S.ctry=e.target.value;save();renderPrev()};
$('#q').oninput=$('#hot').onchange=$('#fc').onchange=renderList;
$('#fol').checked=S.fol!==false;$('#fol').onchange=e=>{S.fol=e.target.checked;if(S.fol)follow();save();renderCt();renderPrev()};
$('#bAll').onclick=e=>{const b=e.target,L=filt();if(!L.length)return;
if(!b.dataset.a){b.dataset.a=1;b.textContent=`Bấm lần nữa để gán «${S.ctry}» cho ${L.length} SP`;setTimeout(()=>{if(b.dataset.a)renderList()},3000);return}
L.forEach(p=>p.c=S.ctry);save();render()};
$('#list').onclick=e=>{const s=e.target.closest('[data-s]');if(s){const p=S.P.find(x=>x.m===s.dataset.s);p.h=!p.h;save();renderList();return}
const li=e.target.closest('li[data-m]');if(li){S.sel=li.dataset.m;follow();save();renderCt();render()}};
$('#bE').onclick=()=>editP(false);$('#bN').onclick=()=>editP(true);$('#bC').onclick=editC;$('#bB').onclick=backup;$('#bS').onclick=subDlg;
follow();renderCt();render();
</script></body></html>
