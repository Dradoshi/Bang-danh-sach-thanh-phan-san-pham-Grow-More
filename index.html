<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.5 var(--ff);display:flex;flex-direction:column;overflow:hidden}

.tb button,.ctw{white-space:nowrap}.ctw select{width:auto;min-width:0;margin:0;font-weight:600;padding:4px 8px;background:var(--card)}

.ph{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-start}.pt{flex:1 1 320px;min-width:0}.pa{display:flex;gap:8px;flex-wrap:wrap}

.rec{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:12px;font-size:13px;color:var(--mut)}.rec .chip{font:500 13px var(--ff);font-variant-numeric:tabular-nums;background:var(--tint);border-color:transparent;color:var(--fg)}

.ebw{flex-wrap:wrap;row-gap:8px}.ebw .hdb{display:flex;flex-wrap:wrap;gap:6px;align-items:center;letter-spacing:0;text-transform:none;font-weight:500}.ebw i{min-width:12px}

.out{background:var(--tint);border:1.5px solid var(--bd2);border-radius:14px;padding:16px 18px;font-size:16.5px;line-height:1.6;word-break:break-word}.out.w{border-color:var(--wfg)}
.box{background:var(--tint);border-radius:12px;padding:12px 14px;word-break:break-word}
.gs{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.g{border:1px solid var(--line);border-radius:12px;overflow:hidden}.g h4{margin:0 0 4px;font-size:13px;letter-spacing:.04em;background:var(--tint);padding:6px 10px}
.g div{display:flex;justify-content:space-between;gap:8px;padding:4px 10px;border-bottom:1px solid var(--line);font-size:15px}.g div b{white-space:nowrap}.g .n{color:var(--mut)}
.bar{background:var(--acc);color:var(--on);font-weight:700;text-align:center;padding:7px;border-radius:8px;margin:12px 0 8px;letter-spacing:.3px}.bar:first-child{margin-top:0}
.e{color:var(--mut)}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--fg);width:min(760px,94vw);max-height:90vh;padding:16px;overflow:auto}
dialog::backdrop{background:#0007}dialog h2{margin:0 0 10px;font-size:19px;color:var(--acc)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 10px}.act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px;flex-wrap:wrap}
.row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:0 10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}.row input,.row textarea{margin-top:0}.row textarea{resize:vertical;line-height:1.45}
@media(max-width:560px){.row{grid-template-columns:1fr;gap:6px}.lf{flex-wrap:wrap}.lf .chk{white-space:normal;flex-basis:100%}#bAll{max-width:100%;white-space:normal}}
.cv{min-width:0}.cv span{display:block;font-size:14px;line-height:1.3;color:var(--mut);overflow-wrap:anywhere}.cv div{display:flex;gap:6px;margin-bottom:8px}.cv input{flex:1;min-width:0}
/* Ô đơn vị tự co giãn theo nội dung, không còn khóa cứng 118px nên không bị cắt chữ */
.cv select{width:auto;flex:0 0 auto;min-width:84px;max-width:58%;text-overflow:ellipsis}
.gh{margin:12px 0 6px;font-size:14px;font-weight:700;background:var(--tint);color:var(--acc);padding:4px 8px;border-radius:6px;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:30px}

/* Lưới thành phần: số cột (--c) do JS tính theo số thành phần để các hàng đều nhau, không rớt 1 ô lẻ xuống dòng */

dialog.wide{width:min(980px,96vw)}
dialog.wide .fg{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
@media(max-width:900px){.cg{grid-template-columns:repeat(auto-fill,minmax(215px,1fr))}}
.addf{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin:0 0 8px;padding:8px;border:1px dashed var(--bd2);border-radius:8px;background:var(--bg);max-width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.addf[hidden]{display:none}
.addf input,.addf select,.frow input,.frow select{margin:0;width:auto;min-width:0}
.addf .an,.addf #nn{flex:1 0 180px}.addf .au,.addf #nu{flex:0 0 110px}.addf #ng{flex:0 0 150px}.addf button{padding:5px 12px;flex:0 0 auto}
/* Giữ mỗi dòng quản lý thành phần trên một hàng; màn hình hẹp có thể cuộn ngang thay vì tự xuống dòng. */
#fl{max-width:100%;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch}
.frow{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin-bottom:6px;border-radius:8px;min-width:760px}.frow.nw{animation:flash 1.2s ease-out}
.frow .fn{flex:1 1 190px;min-width:150px}.frow .fl{flex:1 1 170px;min-width:150px}.frow .fu{flex:0 0 96px}.frow .fgp{flex:0 0 172px}
.fb{display:flex;gap:4px;flex:none}.fb button{padding:4px 9px;min-width:32px;justify-content:center}.fb button:disabled{opacity:.35;cursor:default;pointer-events:none}.fb [data-a=del]{color:var(--acc)}
.hint{font-size:13.5px;margin:2px 0 8px}
/* Thanh nút Lưu/Đóng luôn nằm dưới đáy hộp thoại, kèm dòng thông báo — không bị cuộn mất khi form dài */
dialog .dact{position:sticky;bottom:-16px;z-index:2;margin:12px -16px -16px;padding:10px 16px;background:var(--card);border-top:1px solid var(--line);align-items:center}
.dact #msg{flex:1 1 220px;margin:0;text-align:left;font-size:14px;line-height:1.35;color:var(--acc);font-weight:600}.dact #msg:empty{display:none}
.sd{position:relative;top:var(--sd,.2em);color:var(--acc);font-weight:700}.sd2{position:relative;top:calc(var(--sd,.2em)*2);color:var(--acc);font-weight:700}
.gs .sd,.gs .sd2{color:inherit;font-weight:inherit}
.how p{margin:4px 0;font-size:14px}
.gh label{display:flex;align-items:center;gap:6px;margin:0;font-size:13px;font-weight:500;color:var(--mut)}.gh select{width:auto;margin:0;padding:1px 6px;font-size:13px}.fb .pn{opacity:.35;filter:grayscale(1)}.fb .pn.on{opacity:1;filter:none;border-color:var(--acc);background:var(--tint)}
/* HDSD: tiêu đề đậm, chữ mũ (m²), không nền */
.hd{line-height:1.55;font-size:16px;word-break:break-word;padding:2px 0}.hd .hh{font-weight:700}.su{position:relative;top:-.45em;font-size:.65em;line-height:0}.hd .sd,.hd .sd2{color:inherit;font-weight:inherit}textarea#hd{line-height:1.45;resize:vertical}.hd>div:not(.hh){text-align:justify;text-align-last:left;hyphens:none}.hd .hh{text-align:left}
@media(max-width:900px){html,body{height:auto}body{overflow:auto}main{flex:none;grid-template-columns:1fr}main>section{overflow:visible}main>section:first-child{display:block}ul{flex:none;max-height:50vh;overflow-y:auto}.fr{flex-wrap:wrap}}

/* ===== Animation ===== */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dlg{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes flash{from{background:var(--bd2)}to{background:var(--tint)}}
header{animation:down .5s cubic-bezier(.2,.7,.2,1) both}
main>section:nth-child(1){animation:up .5s .08s cubic-bezier(.2,.7,.2,1) both}
main>section:nth-child(2){animation:up .5s .16s cubic-bezier(.2,.7,.2,1) both}
#prev.anim>*{animation:up .42s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n,0)*38ms)}
ul.anim li{animation:up .32s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n,0)*20ms)}
.out.fl{animation:flash .8s ease-out}.cst{animation:fade .3s ease-out}.pop{animation:pop .35s ease-out}
dialog[open]{animation:dlg .24s cubic-bezier(.2,.8,.2,1)}dialog[open]::backdrop{animation:fade .22s ease-out}
button{transition:transform .15s,box-shadow .2s,background-color .2s,border-color .2s,color .2s}
button:not(.st):not(.chip):hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(184,74,71,.18)}
button:active{transform:scale(.96)!important;box-shadow:none}
.chip:hover{border-color:var(--acc);color:var(--acc)}.chip.on:hover{color:var(--on)}
.st{transition:transform .15s,color .2s}.st:hover{transform:scale(1.28)}
.hs{transition:transform .15s,color .2s,border-color .2s}.hs:hover:not(.h){color:#f0b400}
li{transition:background-color .2s,color .2s}
.logo{transition:transform .4s cubic-bezier(.3,1.4,.5,1)}.logo:hover{transform:rotate(-9deg) scale(1.08)}
.ctw,.tag,.out,.box{transition:background-color .3s,border-color .3s,color .3s}
input:not([type=checkbox]),select,textarea{transition:border-color .2s,box-shadow .2s}
.sr input:focus,input:focus,select:focus,textarea:focus{outline:0;border-color:var(--acc);box-shadow:0 0 0 3px rgba(184,74,71,.16)}
ul,main>section,dialog{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* ===== Tên thành phần: đậm + đỏ ===== */
.g div>span{font-weight:700;color:var(--nm)}

.chip.has:not(.on){background:var(--wbg);border-color:var(--wl);color:var(--wfg)}

.mwl{display:flex;gap:6px;align-items:center;margin:8px 0 0;font-size:14px;font-weight:600;color:var(--wfg)}.mwl .ic{width:15px;height:15px}
.eb .mkk{color:var(--wfg);font-weight:600}

.dact .mw{flex:1 1 100%;display:flex;align-items:center;gap:6px;background:var(--wbg);color:var(--wfg);border:1px solid var(--wl);border-radius:8px;padding:5px 10px;font-size:14px;font-weight:600}.dact .mw[hidden]{display:none}

.back{display:none}.bs{display:contents}.eb button{flex:none;white-space:nowrap}.eb>span:first-child{min-width:0}.eb i{min-width:12px}
.cr{flex-wrap:wrap}.kbh{white-space:nowrap}

/* ===== Thanh lọc: 6 mục luôn nằm trên 1 hàng, cao bằng nhau, không cắt chữ =====
   Mọi kích thước bên trong dùng đơn vị em nên cả thanh co/giãn đồng đều theo --fs.
   --fs do đoạn script "fitFilterBar" ở cuối trang chọn: lớn nhất có thể (8–14px) mà vẫn vừa 1 hàng. */
.fr{
  --fs:11px;
  display:flex;flex-flow:row nowrap;align-items:center;justify-content:flex-start;
  gap:.3em;width:100%;max-width:100%;min-width:0;margin:8px 0 6px;padding:2px 1px;
  font:500 var(--fs)/1 'Barlow Semi Condensed','Barlow',system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  white-space:nowrap;
  /* Chỉ cuộn ngang khi màn hình hẹp hơn mức nhỏ nhất (~<320px); chữ vẫn đủ, không bị cắt */
  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}
.fr::-webkit-scrollbar{display:none}
.fr>.chip,.fr>.fcw{
  flex:0 0 auto;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;
  height:max(2.4em,28px);min-height:0;margin:0;border-radius:999px;
  font:inherit;line-height:1;letter-spacing:0;white-space:nowrap;
}
.fr>.chip{padding:0 .62em;gap:0}
.fr>.chip.on{font-weight:600}
.fr[data-m]>.chip{font-weight:600}/* chỉ bật trong lúc đo, để cỡ chữ không đổi khi đổi nút đang chọn */
.fr>.chip:has(.cn){padding-right:.3em}
.fr .wb{display:none}
/* Chế độ 2 dòng (JS bật data-w khi màn hẹp): 2 nút dài xuống 2 dòng NGAY TRONG nút, vẫn cùng 1 hàng, cùng chiều cao */
.fr[data-w]{gap:.3em}
.fr[data-w]>.chip,.fr[data-w]>.fcw{height:max(3.2em,34px)}
.fr[data-w]>.chip{text-align:center;line-height:1.08}
.fr[data-w] .wb{display:inline}
.fr>.chip .cn{
  display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;
  min-width:1.75em;height:1.75em;padding:0 .3em;margin-left:.4em;border-radius:999px;
  font-size:.95em;line-height:1;
}
/* Ô chọn quốc gia: cùng chiều cao với các nút, mũi tên vẽ bằng CSS để tiết kiệm chỗ */
.fr>.fcw{position:relative;padding:0;gap:0;color:var(--mut)}
.fr>.fcw select{
  -webkit-appearance:none;appearance:none;
  /* !important để thắng bề rộng px mà hàm fit(select) của ứng dụng gắn inline; bề rộng tự theo --fs */
  width:auto!important;min-width:0;max-width:none;height:100%;margin:0;border:0;border-radius:inherit;
  background:transparent;padding:0 1.5em 0 .62em;
  font:inherit;line-height:1;color:var(--fg);cursor:pointer;
}
.fr>.fcw::after{
  content:"";position:absolute;right:.66em;top:50%;width:.38em;height:.38em;
  border:solid currentColor;border-width:0 1.5px 1.5px 0;
  transform:translateY(-72%) rotate(45deg);pointer-events:none;
}
.fr>.fcw:focus-within{border-color:var(--acc)}

/* Đọc bảng dán từ Excel (TSV) có ô nhiều dòng nằm trong dấu " " */
function tsv(t){const R=[];let r=[],c='',q=false;for(let i=0;i<t.length;i++){const h=t[i];
if(q){if(h==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=h}
else if(h==='"'&&c==='')q=true;else if(h==='\t'){r.push(c);c=''}
else if(h==='\n'||h==='\r'){if(h==='\r'&&t[i+1]==='\n')i++;r.push(c);R.push(r);r=[];c=''}else c+=h}
r.push(c);R.push(r);return R}

/* fitFilterBar: giữ cả 6 mục của thanh lọc trên 1 hàng, không cắt chữ, chữ lớn nhất có thể.
   1) Thử 1 dòng/nút: tìm cỡ chữ lớn nhất (MIN–MAX px) còn vừa hàng.
   2) Nếu cỡ đó nhỏ hơn COMFY=10px (màn hẹp như điện thoại), chuyển sang chế độ 2 dòng trong nút
      (2 nút dài xuống dòng) rồi tìm lại cỡ chữ lớn nhất. Đặt COMFY=0 nếu muốn luôn 1 dòng. */
(function(){
  var fr=document.querySelector('.fr');if(!fr)return;
  var MIN=8,MAX=14,COMFY=10,lastW=-1,busy=false;
  function fits(px){fr.style.setProperty('--fs',px+'px');var l=fr.lastElementChild.getBoundingClientRect(),f=fr.getBoundingClientRect();return l.right<=f.right-2}
  function best(){
    if(fits(MAX))return MAX;
    if(!fits(MIN))return 0;
    var lo=MIN,hi=MAX,m;
    for(var i=0;i<9;i++){m=(lo+hi)/2;if(fits(m))lo=m;else hi=m}
    return Math.floor(lo*20)/20;
  }
  function fit(){
    if(busy)return;busy=true;fr.setAttribute('data-m','');
    try{
      lastW=fr.clientWidth;
      fr.removeAttribute('data-w');
      var a=best();
      if(a>=COMFY)return fr.style.setProperty('--fs',a+'px');
      fr.setAttribute('data-w','');
      var b=best();
      if(b>a){fr.style.setProperty('--fs',b+'px')}
      else{fr.removeAttribute('data-w');fr.style.setProperty('--fs',(a||MIN)+'px')}
    }finally{fr.removeAttribute('data-m');busy=false}
  }
  fit();
  if(window.ResizeObserver)new ResizeObserver(function(){if(fr.clientWidth!==lastW)fit()}).observe(fr);
  else window.addEventListener('resize',fit);
  if(window.MutationObserver)new MutationObserver(fit).observe(fr,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['class']});
  window.addEventListener('orientationchange',fit);
  window.addEventListener('load',fit);
  if(document.fonts){document.fonts.ready.then(fit);if(document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',fit)}
})();
</script>

 const b=bs?JSON.parse(bs):null,a=JSON.parse(as),L=[];if(!b)return['Khởi tạo cài đặt chung'];
 const nm=x=>new Set(x.map(f=>f[0])),bn=nm(b.F),an=nm(a.F);
 [...an].filter(x=>!bn.has(x)).forEach(x=>L.push('Thêm thành phần: '+x));[...bn].filter(x=>!an.has(x)).forEach(x=>L.push('Xóa/đổi tên thành phần: '+x));
 if(JSON.stringify(b.F)!==JSON.stringify(a.F)&&!L.length)L.push('Sửa thành phần (đơn vị/thứ tự/nhóm)');
 if(JSON.stringify(b.C)!==JSON.stringify(a.C))L.push('Sửa cài đặt quốc gia sản xuất');
 if(b.foot!==a.foot)L.push('Sửa chân trang nhãn (NSX&HSD)');
 if(JSON.stringify(b.srt)!==JSON.stringify(a.srt))L.push('Sửa chế độ xếp thành phần');
 return L.length?L:['Cập nhật cài đặt']}

/* ---------- trạng thái ---------- */
const base={P:new Map(),cfg:null};
const remote={P:new Map(),cfg:null};
let gotP=false,gotC=false,fromCache=true,ready=false,applying=false,flushing=false,again=false,tm=null,pendingRemote=false,seedAsked=false;
const kindMap=new Map();

function derive(){
 const c=remote.cfg?JSON.parse(remote.cfg):cfgO(),FF=c.F;
 const P=[];remote.P.forEach(j=>{try{P.push(fromSnap(JSON.parse(j),FF))}catch(e){}});
 P.sort((a,b)=>a.m.localeCompare(b.m));return{c,P}}
function applyRemote(){
 if(!gotP||!gotC)return;
 if(tm||flushing||dlg.open){pendingRemote=true;return}
 pendingRemote=false;
 const{c,P}=derive();
 const sameCfg=JSON.stringify({F:c.F,C:c.C,foot:c.foot||'',srt:c.srt||{}})===cfgS();
 let sameP=P.length===S.P.length;
 if(sameP&&sameCfg){const cm=curMap();sameP=P.every(p=>cm.get(p.m)===snapS(p,c.F))}
 if(!(sameP&&sameCfg)){
  applying=true;
  S.F=c.F;S.C=c.C;S.foot=c.foot||'';S.srt=c.srt||{};initF();
  S.P=P;S.P.forEach(p=>{while(p.v.length<F.length)p.v.push(null)});
  if(!S.C.some(x=>x.n===S.ctry))S.ctry=S.C[0]?S.C[0].n:'';
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  applying=false;render();
 }
 base.P=curMap();base.cfg=cfgS();
 if(!ready){ready=true;status('ok','Đồng bộ · '+userName,'Đã kết nối dữ liệu dùng chung. Bấm để đổi tên.')}
}
async function commit(items){for(let i=0;i<items.length;i+=400){const b=writeBatch(db);items.slice(i,i+400).forEach(f=>f(b));await b.commit()}}
async function flush(){
 tm=null;if(!ready||applying)return;
 if(flushing){again=true;return}
 const cur=curMap(),cs=cfgS(),ops=[];
 cur.forEach((s,m)=>{if(base.P.get(m)!==s)ops.push({m,b:base.P.get(m)||null,a:s})});
 base.P.forEach((s,m)=>{if(!cur.has(m))ops.push({m,b:s,a:null})});
 const cfgCh=cs!==base.cfg;
 if(!ops.length&&!cfgCh){if(pendingRemote)applyRemote();return}
 if(!auth.currentUser){status('off','Chưa đăng nhập – chưa lưu chung','Bấm để đăng nhập');return}
 flushing=true;status('conn','Đang lưu…');
 const by=userName||'?',em=userEmail,items=[];
 ops.forEach(o=>{
  const meta=kindMap.get(o.m),B=o.b?JSON.parse(o.b):null,A=o.a?JSON.parse(o.a):null,kind=meta?meta.kind:!B?'create':!A?'delete':'update';
  const ch=meta?['Khôi phục về bản lúc '+meta.note,...sumP(B,A)]:sumP(B,A);
  items.push(b=>{
   if(A)b.set(doc(db,'products',o.m),{m:o.m,n:A.n,json:o.a,by,email:em,at:serverTimestamp()});else b.delete(doc(db,'products',o.m));
   b.set(doc(collection(db,'history')),{m:o.m,by,email:em,at:serverTimestamp(),kind,before:o.b,after:o.a,changes:ch.slice(0,40)})});
 });
 if(cfgCh)items.push(b=>{b.set(doc(db,'meta','config'),{json:cs,by,email:em,at:serverTimestamp()});
  b.set(doc(collection(db,'history')),{m:'_config',by,email:em,at:serverTimestamp(),kind:'config',before:base.cfg,after:cs,changes:sumC(base.cfg,cs)})});
 try{await commit(items);base.P=cur;base.cfg=cs;ops.forEach(o=>kindMap.delete(o.m));status('ok','Đồng bộ · '+userName,'Đã lưu lên dữ liệu dùng chung')}
 catch(e){console.error(e);status('off','Lỗi lưu – đang thử lại','Không lưu được lên máy chủ: '+(e&&e.code||e));setTimeout(()=>flush(),5000)}
 flushing=false;
 if(again){again=false;flush()}else if(pendingRemote)applyRemote();
}
window.__sync={onSave(){if(!ready||applying)return;clearTimeout(tm);tm=setTimeout(flush,300)}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&tm){clearTimeout(tm);flush()}});
dlg.addEventListener('close',()=>{if(tm){clearTimeout(tm);flush()}else if(pendingRemote)applyRemote()});

async function seed(){
 const cur=curMap(),by=userName||'?',items=[];
 S.P.forEach(p=>{items.push(b=>b.set(doc(db,'products',p.m),{m:p.m,n:p.n||'',json:snapS(p),by,email:userEmail,at:serverTimestamp()}))});
 items.push(b=>{b.set(doc(db,'meta','config'),{json:cfgS(),by,email:userEmail,at:serverTimestamp()});
  b.set(doc(collection(db,'history')),{m:'_config',by,email:userEmail,at:serverTimestamp(),kind:'seed',before:null,after:null,changes:['Khởi tạo dữ liệu chung ('+S.P.length+' sản phẩm)']})});
 await commit(items);base.P=cur;base.cfg=cfgS();ready=true;status('ok','Đồng bộ · '+userName,'Đã tạo dữ liệu dùng chung')}
function maybeApply(){
 if(!gotP||!gotC)return;
 if(remote.cfg===null&&!remote.P.size){
  if(!fromCache&&!seedAsked){seedAsked=true;
   if(confirm('Cơ sở dữ liệu dùng chung đang TRỐNG.\n\nTải dữ liệu hiện có trên máy này ('+S.P.length+' sản phẩm) lên làm dữ liệu gốc cho mọi người?'))seed().catch(e=>{console.error(e);status('off','Lỗi tạo dữ liệu gốc','Kiểm tra Rules của Firestore')});
   else status('off','Chưa có dữ liệu chung','Tải lại trang để thử lại')}
  return}
 applyRemote()}
function listen(){
 const er=e=>{console.error(e);if(e&&e.code==='permission-denied')status('off','Chưa được cấp quyền: '+userEmail,'Email này chưa có trong danh sách được phép (meta/allowed). Nhờ quản lý thêm email rồi tải lại trang.');else status('off','Mất kết nối','Kiểm tra mạng hoặc Rules: '+(e&&e.code||e))};
 onSnapshot(collection(db,'products'),sn=>{remote.P=new Map();sn.forEach(d=>remote.P.set(d.id,d.data().json));gotP=true;fromCache=sn.metadata.fromCache;maybeApply()},er);
 onSnapshot(doc(db,'meta','config'),sn=>{remote.cfg=sn.exists()?sn.data().json:null;gotC=true;maybeApply()},er);
}
addEventListener('offline',()=>status('off','Mất mạng','Thay đổi sẽ được gửi khi có mạng lại'));
addEventListener('online',()=>ready&&status('ok','Đồng bộ · '+userName));

/* ---------- nhật ký + khôi phục ---------- */
const tmo=e=>e.at&&e.at.toDate?e.at.toDate():new Date();
async function openLog(m){
 openD('Nhật ký thay đổi'+(m?' · MSPB '+m:''),(m?'':'<input id="lgq" placeholder="Lọc theo MSPB hoặc tên người sửa" style="margin-bottom:8px">')+'<div id="lgw"><p class="e">Đang tải…</p></div>',null,'','wide');
 const w=$('#lgw');let L;
 try{const q=m?query(collection(db,'history'),where('m','==',m)):query(collection(db,'history'),orderBy('at','desc'),limit(300));
  L=(await getDocs(q)).docs.map(d=>({id:d.id,...d.data()}));L.sort((a,b)=>tmo(b)-tmo(a))}
 catch(e){w.innerHTML='<p class="e">Không tải được nhật ký: '+esc(e&&e.code||e)+'</p>';return}
 const kl={create:'Thêm mới',update:'Sửa',delete:'Xóa',restore:'Khôi phục',config:'Cài đặt chung',seed:'Khởi tạo'};
 const draw=f=>{f=(f||'').trim().toLowerCase();const R=L.filter(e=>!f||String(e.m).toLowerCase().includes(f)||String(e.by).toLowerCase().includes(f));
  w.innerHTML=R.length?R.map(e=>'<div style="border-bottom:1px solid var(--line);padding:8px 2px"><div><b>'+esc(tmo(e).toLocaleString('vi-VN'))+'</b> · '+esc(e.by)+' · <span style="color:var(--acc)">'+esc(kl[e.kind]||e.kind)+'</span> · '+(e.m==='_config'?'Cài đặt chung':'MSPB '+esc(e.m))+'</div>'+
   (e.changes||[]).slice(0,8).map(x=>'<div class="e" style="font-size:13.5px;word-break:break-word">• '+esc(x)+'</div>').join('')+((e.changes||[]).length>8?'<div class="e">… và '+(e.changes.length-8)+' thay đổi khác</div>':'')+
   (e.before&&e.m!=='_config'&&e.kind!=='create'?'<button data-r="'+esc(e.id)+'" style="margin-top:6px">'+ic('hist')+'Khôi phục về bản trước lần sửa này</button>':'')+'</div>').join(''):'<p class="e">Chưa có thay đổi nào.</p>'};
 draw('');const q=$('#lgq');if(q)q.oninput=()=>draw(q.value);
 w.onclick=ev=>{const b=ev.target.closest('[data-r]');if(!b)return;if(!sure(b,'Bấm lần nữa để khôi phục'))return;
  const e=L.find(x=>x.id===b.dataset.r);if(!e)return;
  const p=fromSnap(JSON.parse(e.before)),i=S.P.findIndex(x=>x.m===p.m);
  if(i>=0)S.P[i]=p;else{S.P.push(p);S.P.sort((a,c)=>a.m.localeCompare(c.m))}
  S.sel=p.m;kindMap.set(p.m,{kind:'restore',note:tmo(e).toLocaleString('vi-VN')+' (của '+e.by+')'});
  save();render();dlg.close()}}
bLog.onclick=()=>openLog();
bSync.onclick=async()=>{
 if(!auth.currentUser){await login();return}
 if(confirm('Đang đăng nhập: '+userEmail+'\n\nĐăng xuất?')){await signOut(auth);location.reload()}};
const _rp=renderPrev;
renderPrev=function(){_rp.apply(this,arguments);const p=cur(),e=document.querySelector('#prev .id');
 if(p&&e&&!document.getElementById('bPLog')){const b=document.createElement('button');b.id='bPLog';b.type='button';b.style.marginLeft='8px';b.innerHTML=ic('hist')+'Lịch sử';b.onclick=()=>openLog(p.m);e.after(b)}};
renderPrev();

onAuthStateChanged(auth,u=>{
 if(u){userName=u.displayName||u.email;userEmail=u.email||'';status('conn','Đang kết nối…');if(!listening){listening=true;listen()}}
 else status('off','Đăng nhập Google','Bấm để đăng nhập bằng tài khoản Gmail');});
})();
</script>
