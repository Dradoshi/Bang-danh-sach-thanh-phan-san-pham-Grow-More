*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15.5px/1.5 var(--ff);display:flex;flex-direction:column;overflow:hidden}

.row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:0 10px;align-items:start;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}.row input,.row textarea{margin-top:0}.row textarea{resize:vertical;line-height:1.45}

#fl{max-width:100%;overflow-x:auto;overflow-y:visible;-webkit-overflow-scrolling:touch}
.frow{display:flex;flex-wrap:nowrap;gap:6px;align-items:center;margin-bottom:6px;border-radius:8px;min-width:760px}.frow.nw{animation:flash 1.2s ease-out}

/* ===== Animation ===== */
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes down{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dlg{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
@keyframes flash{from{background:var(--bd2)}to{background:var(--tint)}}
header{animation:down .5s cubic-bezier(.2,.7,.2,1) both}
main>section:nth-child(1){animation:up .5s .08s cubic-bezier(.2,.7,.2,1) both}

ul.anim li{animation:up .32s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n,0)*20ms)}
.out.fl{animation:flash .8s ease-out}.cst{animation:fade .3s ease-out}.pop{animation:pop .35s ease-out}
dialog[open]{animation:dlg .24s cubic-bezier(.2,.8,.2,1)}dialog[open]::backdrop{animation:fade .22s ease-out}
button{transition:transform .15s,box-shadow .2s,background-color .2s,border-color .2s,color .2s}

.chip:hover{border-color:var(--acc);color:var(--acc)}.chip.on:hover{color:var(--on)}

li{transition:background-color .2s,color .2s}
.logo{transition:transform .4s cubic-bezier(.3,1.4,.5,1)}.logo:hover{transform:rotate(-9deg) scale(1.08)}

input:not([type=checkbox]),select,textarea{transition:border-color .2s,box-shadow .2s}

/* ===== Thanh lọc: 6 mục luôn nằm trên 1 hàng, cao bằng nhau, không cắt chữ =====
   Mọi kích thước bên trong dùng đơn vị em nên cả thanh co/giãn đồng đều theo --fs.
   --fs do đoạn script "fitFilterBar" ở cuối trang chọn: lớn nhất có thể (8–14px) mà vẫn vừa 1 hàng. */
.fr{
  --fs:11px;
  display:flex;flex-flow:row nowrap;align-items:center;justify-content:flex-start;
  gap:.3em;width:100%;max-width:100%;min-width:0;margin:8px 0 6px;padding:2px 1px;

  overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;
}

.fr>.chip,.fr>.fcw{
  flex:0 0 auto;box-sizing:border-box;display:inline-flex;align-items:center;justify-content:center;
  height:max(2.4em,28px);min-height:0;margin:0;border-radius:999px;
  font:inherit;line-height:1;letter-spacing:0;white-space:nowrap;
}
.fr>.chip{padding:0 .62em;gap:0}
.fr>.chip.on{font-weight:600}
.fr[data-m]>.chip{font-weight:600}/* chỉ bật trong lúc đo, để cỡ chữ không đổi khi đổi nút đang chọn */
.fr>.chip:has(.cn){padding-right:.3em}
.fr .wb{display:none}
/* Chế độ 2 dòng (JS bật data-w khi màn hẹp): 2 nút dài xuống 2 dòng NGAY TRONG nút, vẫn cùng 1 hàng, cùng chiều cao */
.fr[data-w]{gap:.3em}
.fr[data-w]>.chip,.fr[data-w]>.fcw{height:max(3.2em,34px)}
.fr[data-w]>.chip{text-align:center;line-height:1.08}
.fr[data-w] .wb{display:inline}
.fr>.chip .cn{
  display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box;
  min-width:1.75em;height:1.75em;padding:0 .3em;margin-left:.4em;border-radius:999px;
  font-size:.95em;line-height:1;
}
/* Ô chọn quốc gia: cùng chiều cao với các nút, mũi tên vẽ bằng CSS để tiết kiệm chỗ */
.fr>.fcw{position:relative;padding:0;gap:0;color:var(--mut)}
.fr>.fcw select{
  -webkit-appearance:none;appearance:none;
  /* !important để thắng bề rộng px mà hàm fit(select) của ứng dụng gắn inline; bề rộng tự theo --fs */
  width:auto!important;min-width:0;max-width:none;height:100%;margin:0;border:0;border-radius:inherit;
  background:transparent;padding:0 1.5em 0 .62em;
  font:inherit;line-height:1;color:var(--fg);cursor:pointer;
}
.fr>.fcw::after{
  content:"";position:absolute;right:.66em;top:50%;width:.38em;height:.38em;
  border:solid currentColor;border-width:0 1.5px 1.5px 0;
  transform:translateY(-72%) rotate(45deg);pointer-events:none;
}

/* Nhận diện HDSD: mỗi mục = TIÊU ĐỀ (chữ đậm) + NỘI DUNG. Thứ tự thử: (0) dấu «||» gõ tay → (1) tiêu đề nằm riêng một dòng → (2) trước dấu «:» (nếu ngay sau «:» là cụm ngoặc liệt kê ví dụ thì cụm đó vẫn thuộc tiêu đề) → (3) hết cụm ngoặc (...) đầu tiên → (4) trước điểm bắt đầu liều lượng (Liều lượng/Pha/Phun/Hòa/Tưới/Sử dụng hoặc số + đơn vị, bỏ qua chữ trong ngoặc). Sau khi tách, đoạn có nội dung trống / mở đầu bằng ngoặc / không có số liều lượng bị đánh dấu «đáng ngờ» (khung vàng). Tiêu đề không được chứa liều lượng (số + ml, g, lít, m2, %...). Không nhận ra → h rỗng, hiện khung cảnh báo vàng. */
const HDDOSE=/\d\s*(?:ml|cc|g|kg|lít|l|m2|m²|m<2>|ha|%|ppm)(?![A-Za-zÀ-ỹ])/i;
const hdHead=x=>!!x&&x.length<=400&&!HDDOSE.test(x)&&!/^(liều lượng|pha|phun|hòa|sử dụng)(\s|$)/i.test(x);
/* Điểm bắt đầu phần liều lượng: chữ «Liều lượng/Pha/Phun/Hòa/Tưới/Sử dụng» hoặc số + đơn vị, bỏ qua chữ nằm trong ngoặc */
function hdCue(t){let m=t;while(/\([^()]*\)/.test(m))m=m.replace(/\([^()]*\)/g,x=>'#'.repeat(x.length));

if(ci>0&&(pi<0||ci<pi)&&hdHead(t.slice(0,ci).trim())){h=t.slice(0,ci);b=t.slice(ci+1);
/* «Cây công nghiệp: (trà, cà phê, …). Liều lượng…» → cụm ngoặc ví dụ ngay sau dấu «:» vẫn thuộc tiêu đề */

/* fitFilterBar: giữ cả 6 mục của thanh lọc trên 1 hàng, không cắt chữ, chữ lớn nhất có thể.
   1) Thử 1 dòng/nút: tìm cỡ chữ lớn nhất (MIN–MAX px) còn vừa hàng.
   2) Nếu cỡ đó nhỏ hơn COMFY=10px (màn hẹp như điện thoại), chuyển sang chế độ 2 dòng trong nút
      (2 nút dài xuống dòng) rồi tìm lại cỡ chữ lớn nhất. Đặt COMFY=0 nếu muốn luôn 1 dòng. */
(function(){
  var fr=document.querySelector('.fr');if(!fr)return;
  var MIN=8,MAX=14,COMFY=10,lastW=-1,busy=false;
  function fits(px){fr.style.setProperty('--fs',px+'px');var l=fr.lastElementChild.getBoundingClientRect(),f=fr.getBoundingClientRect();return l.right<=f.right-2}
  function best(){
    if(fits(MAX))return MAX;
    if(!fits(MIN))return 0;
    var lo=MIN,hi=MAX,m;
    for(var i=0;i<9;i++){m=(lo+hi)/2;if(fits(m))lo=m;else hi=m}
    return Math.floor(lo*20)/20;
  }
  function fit(){
    if(busy)return;busy=true;fr.setAttribute('data-m','');
    try{
      lastW=fr.clientWidth;
      fr.removeAttribute('data-w');
      var a=best();
      if(a>=COMFY)return fr.style.setProperty('--fs',a+'px');
      fr.setAttribute('data-w','');
      var b=best();
      if(b>a){fr.style.setProperty('--fs',b+'px')}
      else{fr.removeAttribute('data-w');fr.style.setProperty('--fs',(a||MIN)+'px')}
    }finally{fr.removeAttribute('data-m');busy=false}
  }
  fit();
  if(window.ResizeObserver)new ResizeObserver(function(){if(fr.clientWidth!==lastW)fit()}).observe(fr);
  else window.addEventListener('resize',fit);
  if(window.MutationObserver)new MutationObserver(fit).observe(fr,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['class']});
  window.addEventListener('orientationchange',fit);
  window.addEventListener('load',fit);
  if(document.fonts){document.fonts.ready.then(fit);if(document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',fit)}
})();
</script>

  mb.setAttribute('aria-label',on?'Đóng menu':'Mở menu');mb.title=on?'Đóng menu':'Mở menu';mb.innerHTML=ic(on?'x':'menu');if(!on)closeMenus()}
 function openG(g){closeMenus(g);g.classList.remove('r');g.classList.add('open');tgOf(g).setAttribute('aria-expanded','true');
  var r=g.querySelector('.mp').getBoundingClientRect();if(r.right>innerWidth-8)g.classList.add('r')}
 setNav(false);

 /* Bắt ở giai đoạn capture và đăng ký trước đoạn đồng bộ → vẫn đóng menu khi nút bị chặn (khách chưa đăng nhập) */
 document.addEventListener('click',function(e){
  var el=e.target&&e.target.closest?e.target:null;if(!el)return;
  if(el.closest('#bMenu')){setNav(!hdr.classList.contains('nav-open'));return}
  var tg=el.closest('.mt');
  if(tg&&!mq.matches&&!tg.hasAttribute('data-nomenu')){var g=tg.closest('.mg');if(g.classList.contains('open'))closeMenus();else openG(g);return}
  if(el.closest('.mp button')){setTimeout(function(){closeMenus();if(mq.matches)setNav(false)},0);return}
  if(!el.closest('.mg'))closeMenus();
  if(mq.matches&&!el.closest('#nav'))setNav(false)
 },true);

 function items(scope){return[].slice.call(scope.querySelectorAll('.mp button')).filter(function(b){return !b.hidden})}
 document.addEventListener('keydown',function(e){
  var el=e.target,og=nav.querySelector('.mg.open');
  if(e.key==='Escape'){
   if(og){e.stopPropagation();var t=tgOf(og);closeMenus();t.focus();return}
   if(hdr.classList.contains('nav-open')){e.stopPropagation();setNav(false);mb.focus()}
   return}
  if(e.key!=='ArrowDown'&&e.key!=='ArrowUp')return;
  var tg=el&&el.closest?el.closest('.mt'):null;
  if(tg&&!mq.matches&&!tg.hasAttribute('data-nomenu')&&e.key==='ArrowDown'){
   e.preventDefault();e.stopPropagation();var g=tg.closest('.mg');openG(g);var it=items(g);if(it[0])it[0].focus();return}
  var inP=el&&el.closest?el.closest('.mp'):null;
  if(inP){
   e.preventDefault();e.stopPropagation();
   var list=items(mq.matches?nav:inP.closest('.mg')),i=list.indexOf(el);
   if(!list.length)return;
   i=e.key==='ArrowDown'?(i+1)%list.length:(i<=0?list.length-1:i-1);list[i].focus()}
 },true);

 var onMq=function(){setNav(false);closeMenus()};
 if(mq.addEventListener)mq.addEventListener('change',onMq);else if(mq.addListener)mq.addListener(onMq);
})();
</script>

 else status('ok','Xin chào '+userName,'Dữ liệu tự cập nhật trực tiếp. Bấm để mở menu tài khoản.')}

/* ---------- ảnh chụp sản phẩm theo TÊN thành phần (bền khi đổi thứ tự cột) ---------- */
const sortO=o=>{const r={};Object.keys(o).sort().forEach(k=>r[k]=o[k]);return r};
function snapP(p,FF){FF=FF||F;const v={};(p.v||[]).forEach((x,i)=>{if(FF[i]&&x!=null&&String(x).trim()!=='')v[FF[i][0]]=String(x)});
 const o={m:p.m,n:p.n||'',l:p.l||'',x:p.x||'',t:p.t||'',c:p.c||'',d:p.d||'',h:!!p.h};OFFK.forEach(k=>{if(p[k])o[k]=true});o.v=sortO(v);return o}
const snapS=(p,FF)=>JSON.stringify(snapP(p,FF));
function fromSnap(s,FF){FF=FF||F;return{m:s.m,n:s.n||'',l:s.l||'',x:s.x||'',t:s.t||'',h:!!s.h,nm:!!s.nm,nl:!!s.nl,nx:!!s.nx,nv:!!s.nv,nd:!!s.nd,c:s.c||'',d:s.d||'',v:FF.map(f=>s.v&&s.v[f[0]]!=null?s.v[f[0]]:null)}}
const cfgO=()=>({F:S.F,C:S.C,foot:S.foot||'',srt:S.srt||{}});
const cfgS=()=>JSON.stringify(cfgO());
const curMap=()=>{const m=new Map();S.P.forEach(p=>m.set(p.m,snapS(p)));return m};

const cut=s=>{s=String(s==null?'':s);return s===''?'(trống)':s.length>60?s.slice(0,60)+'…':s};
function sumP(b,a){
 if(!b)return['Thêm sản phẩm mới'+(a.n?': '+a.n:'')];if(!a)return['Xóa sản phẩm'+(b.n?': '+b.n:'')];
 const L=[],lab={n:'Tên sản phẩm',l:'Loại phân bón',x:'Phương thức',t:'TCCS',c:'Quốc gia SX',d:'HDSD',h:'Hay in'};
 for(const k of['n','l','x','t','c','d','h'])if(b[k]!==a[k])L.push(lab[k]+': '+cut(b[k])+' → '+cut(a[k]));OFFK.forEach(k=>{if(!!b[k]!==!!a[k])L.push(OFFL[k]+' trên nhãn: '+(b[k]?'không có':'có')+' → '+(a[k]?'không có':'có'))});
 new Set([...Object.keys(b.v),...Object.keys(a.v)]).forEach(k=>{if(b.v[k]!==a.v[k])L.push(k+': '+cut(b.v[k])+' → '+cut(a.v[k]))});
 return L.length?L:['Cập nhật']}
function sumC(bs,as){

 const nm=x=>new Set(x.map(f=>f[0])),bn=nm(b.F),an=nm(a.F);
 [...an].filter(x=>!bn.has(x)).forEach(x=>L.push('Thêm thành phần: '+x));[...bn].filter(x=>!an.has(x)).forEach(x=>L.push('Xóa/đổi tên thành phần: '+x));
 if(JSON.stringify(b.F)!==JSON.stringify(a.F)&&!L.length)L.push('Sửa thành phần (đơn vị/thứ tự/nhóm)');
 if(JSON.stringify(b.C)!==JSON.stringify(a.C))L.push('Sửa cài đặt quốc gia sản xuất');

/* ---------- trạng thái đồng bộ ---------- */
const base={P:new Map(),cfg:null};
const remote={P:new Map(),cfg:null};let remoteBy=new Map(),remoteCfgBy='';
let gotP=false,gotC=false,fromCache=true,ready=false,applying=false,flushing=false,again=false,tm=null,pendingRemote=false,seedAsked=false;
const kindMap=new Map();

function derive(){
 const c=remote.cfg?JSON.parse(remote.cfg):cfgO(),FF=c.F;
 const P=[];remote.P.forEach(j=>{try{P.push(fromSnap(JSON.parse(j),FF))}catch(e){}});
 P.sort((a,b)=>a.m.localeCompare(b.m));return{c,P}}
/* force=true: bỏ qua việc chờ (dùng khi hủy thay đổi của khách / người chưa có quyền) */
function applyRemote(force){
 if(!gotP||!gotC)return;
 /* Hộp thoại «Cài đặt người dùng» không sửa dữ liệu nên không cần chặn cập nhật trực tiếp */
 if(!force&&(tm||flushing||(dlg.open&&!dlg.classList.contains('usr')))){pendingRemote=true;return}
 pendingRemote=false;
 const{c,P}=derive();
 const sameCfg=JSON.stringify({F:c.F,C:c.C,foot:c.foot||'',srt:c.srt||{}})===cfgS();
 let sameP=P.length===S.P.length;
 if(sameP&&sameCfg){const cm=curMap();sameP=P.every(p=>cm.get(p.m)===snapS(p,c.F))}
 let changed=false;
 if(!(sameP&&sameCfg)){
  applying=true;
  S.F=c.F;S.C=c.C;S.foot=c.foot||'';S.srt=c.srt||{};initF();
  S.P=P;S.P.forEach(p=>{while(p.v.length<F.length)p.v.push(null)});
  if(!S.C.some(x=>x.n===S.ctry))S.ctry=S.C[0]?S.C[0].n:'';
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  applying=false;render();changed=true;
 }
 base.P=curMap();base.cfg=cfgS();
 if(!ready){ready=true;steady()}
 else if(changed&&!force)toast('Dữ liệu vừa được cập nhật.',null,null,2500);
}
async function commit(items){for(let i=0;i<items.length;i+=400){const b=writeBatch(db);items.slice(i,i+400).forEach(f=>f(b));await b.commit()}}
/* Khách / tài khoản chưa có quyền: bỏ thay đổi vừa làm, trả về đúng dữ liệu chung */
function discardLocal(why){
 clearTimeout(tm);tm=null;again=false;
 if(remote.cfg!==null||remote.P.size){pendingRemote=false;applyRemote(true)}
 if(why==='guest')toast('Bạn cần đăng nhập để lưu chỉnh sửa. Thay đổi vừa rồi chưa được lưu.','Đăng nhập',login,9000);
 else toast('Tài khoản '+userEmail+' chưa có quyền chỉnh sửa nên thay đổi vừa rồi không được lưu. Nhờ quản lý thêm email này vào danh sách được phép.',null,null,10000);

/* ---------- chống ghi đè khi hai người cùng sửa: gộp từng trường (3 bên: bản gốc · bản của tôi · bản mới nhất trên máy chủ) ---------- */
const rNorm=m=>{const j=remote.P.get(m);if(j==null)return null;try{const c=remote.cfg?JSON.parse(remote.cfg):cfgO();return snapS(fromSnap(JSON.parse(j),c.F),c.F)}catch(e){return j}};
const cfgNorm=j=>{try{const c=JSON.parse(j);return JSON.stringify({F:c.F,C:c.C,foot:c.foot||'',srt:c.srt||{}})}catch(e){return j}};
const LAB={nm:'Không có MSPB',nl:'Không có loại phân bón',nx:'Không có phương thức',nv:'Không có thành phần',nd:'Không có HDSD',n:'Tên sản phẩm',l:'Loại phân bón',x:'Phương thức',t:'TCCS',c:'Quốc gia SX',d:'HDSD',h:'Hay in'};
function merge3(Bs,As,Rs){const B=JSON.parse(Bs),A=JSON.parse(As),R=JSON.parse(Rs),out={...R,v:{...R.v}},conf=[];
 const pk=(b,a,r)=>a===b?{x:r}:r===b?{x:a}:a===r?{x:a}:{c:1};
 ['n','l','x','t','c','d','h',...OFFK].forEach(k=>{const p=pk(B[k],A[k],R[k]);if(p.c){conf.push({k,a:A[k],r:R[k]})}else out[k]=p.x});
 new Set([...Object.keys(B.v||{}),...Object.keys(A.v||{}),...Object.keys(R.v||{})]).forEach(k=>{const p=pk((B.v||{})[k],(A.v||{})[k],(R.v||{})[k]);
  if(p.c)conf.push({k,a:(A.v||{})[k],r:(R.v||{})[k],v:1});else if(p.x==null)delete out.v[k];else out.v[k]=p.x});
 out.v=sortO(out.v);return{out,conf}}
function resolveConflicts(ops,cur){
 const out=[],notes=[];let touched=false;
 const setLocal=(m,snap)=>{const i=S.P.findIndex(p=>p.m===m);
  if(snap==null){if(i>=0)S.P.splice(i,1)}else{const np=fromSnap(JSON.parse(snap),F);while(np.v.length<F.length)np.v.push(null);if(i>=0)S.P[i]=np;else S.P.push(np)}
  S.P.sort((a,b)=>a.m.localeCompare(b.m));touched=true};
 for(const o of ops){
  const rj=rNorm(o.m);
  if(o.b===null&&rj===null){out.push(o);continue}
  if(o.b!==null&&rj===o.b){out.push(o);continue}
  if(o.a!==null&&rj===o.a){cur.set(o.m,o.a);continue}
  if(o.a===null&&rj===null){cur.delete(o.m);continue}
  const who=remoteBy.get(o.m)||'người khác',nm=(()=>{try{return JSON.parse(o.a||rj||o.b).n||''}catch(e){return''}})(),tag='MSPB '+o.m+(nm?' ('+nm+')':'');
  if(o.b!==null&&o.a!==null&&rj!==null){
   const r=merge3(o.b,o.a,rj);
   if(!r.conf.length){o.a=JSON.stringify(r.out);o.b=rj;cur.set(o.m,o.a);setLocal(o.m,o.a);notes.push(tag+': đã tự gộp thay đổi của '+who+' vào bản của bạn');out.push(o);continue}
   const lines=r.conf.map(c=>'• '+(LAB[c.k]||c.k)+': bạn «'+cut(c.a)+'» — '+who+' «'+cut(c.r)+'»').join('\n');
   if(confirm(tag+' vừa được '+who+' sửa trong lúc bạn đang sửa, và hai bên đổi cùng một mục:\n\n'+lines+'\n\nOK = giữ bản của BẠN cho các mục này (các mục khác đã tự gộp).\nHủy = lấy bản của '+who+' cho các mục này.')){
    r.conf.forEach(c=>{if(c.v){if(c.a==null)delete r.out.v[c.k];else r.out.v[c.k]=c.a}else r.out[c.k]=c.a});r.out.v=sortO(r.out.v)}
   const fin=JSON.stringify(r.out);
   if(fin===rj){cur.set(o.m,rj);setLocal(o.m,rj);continue}
   o.a=fin;o.b=rj;cur.set(o.m,fin);setLocal(o.m,fin);out.push(o);continue}
  if(o.a===null){
   if(confirm(tag+': bạn đã xóa sản phẩm này, nhưng '+who+' vừa sửa nó.\n\nOK = vẫn xóa.\nHủy = giữ lại bản mới của '+who+'.')){o.b=rj;out.push(o)}
   else{cur.set(o.m,rj);setLocal(o.m,rj)}
   continue}
  if(rj===null){
   if(confirm(tag+': '+who+' vừa xóa sản phẩm này, nhưng bạn đã sửa nó.\n\nOK = giữ và tạo lại bản của bạn.\nHủy = chấp nhận việc xóa.')){o.b=null;out.push(o)}
   else{cur.delete(o.m);setLocal(o.m,null)}
   continue}
  if(confirm(tag+': '+who+' vừa thêm sản phẩm có cùng MSPB này.\n\nOK = ghi đè bằng bản của bạn.\nHủy = giữ bản của '+who+'.')){o.b=rj;out.push(o)}
  else{cur.set(o.m,rj);setLocal(o.m,rj)}
 }
 return{ops:out,notes,touched}}
async function flush(){
 tm=null;if(!ready||applying)return;
 if(flushing){again=true;return}
 let ops=[];const cur=curMap(),cs=cfgS();

 inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();saveName(inp.value)}});
 const bg=$('#uG');if(bg)bg.onclick=()=>{inp.value=gname;inp.focus()};
 $('#uOut').onclick=async e=>{if(!sure(e.currentTarget,'Bấm lần nữa để đăng xuất'))return;try{await signOut(auth)}catch(err){}location.reload()};
 inp.focus();inp.select()}
bUser.onclick=openUser;
bOut.onclick=()=>{if(!confirm('Đăng xuất khỏi tài khoản '+userEmail+'?'))return;Promise.resolve(signOut(auth)).catch(()=>{}).then(()=>location.reload())};
bSync.onclick=async()=>{if(!auth.currentUser)await login()};

/* ---------- nút «Lịch sử» của từng sản phẩm (chỉ khi đã đăng nhập) + khóa ô quốc gia với khách ---------- */
const _rp=renderPrev;
renderPrev=function(){_rp.apply(this,arguments);const p=cur(),pa=document.querySelector('#prev .pa');
 if(p&&pa&&auth.currentUser&&!document.getElementById('bPLog')){const b=document.createElement('button');b.id='bPLog';b.type='button';b.innerHTML=ic('hist')+'Lịch sử';b.onclick=()=>openLog(p.m);const cp=pa.querySelector('#cp');cp?pa.insertBefore(b,cp):pa.appendChild(b)}
 const pc=document.getElementById('pc');if(pc&&editBlock()){pc.disabled=true;pc.title='Đăng nhập để chỉnh sửa'}if(editBlock())document.querySelectorAll('#prev [data-t]').forEach(x=>{x.disabled=true;x.title='Đăng nhập để chỉnh sửa'})};

/* ---------- đăng nhập / đăng xuất ---------- */
onAuthStateChanged(auth,async u=>{
 const uid=u?u.uid:null;
 if(u){try{await u.reload()}catch(e){}
  const cu=auth.currentUser||u;userName=(cu.displayName||'').trim()||cu.email||'Người dùng';userEmail=cu.email||''}
 else{userName='';userEmail=''}
 if(uid!==lastUid){lastUid=uid;canEdit=null;if(listenErr)listen()}
 paintUser();renderPrev();
 if(u&&gotP&&gotC&&!ready)maybeApply();
 steady()});

listen();
})();
</script>
</body></html>
